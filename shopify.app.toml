# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3410e65ba4da377d8a3ffa0fe973caab"
name = "Multi-vendor Inabel"
application_url = "https://shopify-multivendor-production.up.railway.app"
embedded = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["orders/updated"]
  uri = "/webhooks/orders/updated"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_orders,read_products,read_publications,write_inventory,write_metaobject_definitions,write_metaobjects,write_orders,write_products,write_publications"

[auth]
redirect_urls = [
  "https://shopify-multivendor-production.up.railway.app/auth/callback",
  "https://shopify-multivendor-production.up.railway.app/auth/shopify/callback",
  "https://shopify-multivendor-production.up.railway.app/api/auth/callback"
]

[build]
# Keep false so `npm run dev` does NOT overwrite Railway URLs with Cloudflare tunnels
automatically_update_urls_on_dev = false
