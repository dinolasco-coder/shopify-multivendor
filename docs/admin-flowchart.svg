    <text x="390" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#111">App Installed &amp;</text>
    <text x="390" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#111">Authorized?</text>

    <rect x="520" y="312" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="620" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Install / Re-authorize</text>
    <text x="620" y="354" text-anchor="middle" font-size="11" fill="#555">App Scopes</text>

    <rect x="290" y="482" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Admin Dashboard</text>
    <text x="390" y="524" text-anchor="middle" font-size="11" fill="#555">Home</text>

    <polygon points="390,565 490,610 390,655 290,610" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="390" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#111">What do you want</text>
    <text x="390" y="622" text-anchor="middle" font-size="12" font-weight="700" fill="#111">to manage?</text>

    <!-- Sellers column -->
    <rect x="40" y="762" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="140" y="786" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Sellers</text>
    <text x="140" y="804" text-anchor="middle" font-size="11" fill="#555">/app/vendors</text>

    <polygon points="140,855 240,900 140,945 40,900" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="140" y="896" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Invite / Approve</text>
    <text x="140" y="912" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Seller?</text>

    <rect x="40" y="1052" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="140" y="1076" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Approve Seller +</text>
    <text x="140" y="1094" text-anchor="middle" font-size="11" fill="#555">Create Collection</text>

    <rect x="40" y="1162" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="140" y="1196" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Seller Active</text>

    <!-- Products column -->
    <rect x="290" y="762" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="786" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Products</text>
    <text x="390" y="804" text-anchor="middle" font-size="11" fill="#555">/app/products</text>

    <polygon points="390,855 490,900 390,945 290,900" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="390" y="896" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Product Needs</text>
    <text x="390" y="912" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Approval?</text>

    <rect x="290" y="1052" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="1076" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Approve / Reject</text>
    <text x="390" y="1094" text-anchor="middle" font-size="11" fill="#555">Draft Product</text>

    <rect x="290" y="1162" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="1186" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Product Live</text>
    <text x="390" y="1204" text-anchor="middle" font-size="11" fill="#555">or Rejected</text>

    <!-- Orders column -->
    <rect x="540" y="762" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="640" y="786" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Orders</text>
    <text x="640" y="804" text-anchor="middle" font-size="11" fill="#555">/app/orders</text>

    <rect x="540" y="902" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="640" y="926" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Sync / View</text>
    <text x="640" y="944" text-anchor="middle" font-size="11" fill="#555">Seller Splits</text>

    <rect x="540" y="1052" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="640" y="1076" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Cancel Order or</text>
    <text x="640" y="1094" text-anchor="middle" font-size="11" fill="#555">Check Fulfillment</text>

    <rect x="540" y="1162" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="640" y="1196" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Order Updated</text>

    <!-- Money -->
    <polygon points="390,1255 490,1300 390,1345 290,1300" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="390" y="1296" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Money &amp;</text>
    <text x="390" y="1312" text-anchor="middle" font-size="11" font-weight="700" fill="#111">Reports next?</text>

    <rect x="100" y="1452" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="200" y="1476" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Record Payouts</text>
    <text x="200" y="1494" text-anchor="middle" font-size="11" fill="#555">/app/payouts</text>

    <rect x="290" y="1452" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="1476" text-anchor="middle" font-size="12" font-weight="600" fill="#111">View Analytics</text>
    <text x="390" y="1494" text-anchor="middle" font-size="11" fill="#555">/app/reports</text>

    <rect x="480" y="1452" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="580" y="1476" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Settings</text>
    <text x="580" y="1494" text-anchor="middle" font-size="11" fill="#555">/app/settings</text>

    <rect x="290" y="1602" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="1636" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Done for now</text>

    <rect x="290" y="1722" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="1756" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Leave App / Admin</text>

    <ellipse cx="390" cy="1850" rx="70" ry="22" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="390" y="1855" text-anchor="middle" font-size="14" font-weight="700" fill="#111">End</text>
  </g>
</svg>
