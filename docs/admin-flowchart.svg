<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1900" viewBox="0 0 780 1900">
  <rect width="780" height="1900" fill="#ffffff"/>
  <text x="390" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#111">Shopify Admin Flowchart</text>
  <text x="390" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">InabelMarket  Merchant / Multivendor App</text>

  <rect x="280" y="70" width="220" height="1800" rx="12" fill="#f4f6f8"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <g fill="none" stroke="#333" stroke-width="1.75" marker-end="url(#arrow)">
    <path d="M390 92 L390 122"/>
    <path d="M390 178 L390 222"/>
    <path d="M390 278 L390 295"/>

    <!-- auth No � install -->
    <path d="M490 340 L520 340"/>
    <!-- install retry -->
    <path d="M620 312 L620 270 L390 270 L390 295"/>
    <!-- auth Yes � home -->
    <path d="M390 385 L390 482"/>
    <path d="M390 538 L390 565"/>

    <!-- task � sellers / products / orders -->
    <path d="M290 610 L140 610 L140 762"/>
    <path d="M390 655 L390 762"/>
    <path d="M490 610 L640 610 L640 762"/>

    <!-- sellers branch -->
    <path d="M140 818 L140 855"/>
    <path d="M140 945 L140 1052"/>
    <path d="M140 1108 L140 1162"/>
    <path d="M40 900 L40 1190 L40 1300 L290 1300"/>

    <!-- products branch -->
    <path d="M390 818 L390 855"/>
    <path d="M390 945 L390 1052"/>
    <path d="M390 1108 L390 1162"/>
    <path d="M520 900 L520 1190 L390 1190"/>
    <path d="M390 1218 L390 1255"/>

    <!-- orders branch -->
    <path d="M640 818 L640 902"/>
    <path d="M640 958 L640 1052"/>
    <path d="M640 1108 L640 1162"/>
    <path d="M640 1218 L640 1300 L490 1300"/>

    <!-- money branches -->
    <path d="M290 1300 L200 1300 L200 1452"/>
    <path d="M390 1345 L390 1452"/>
    <path d="M490 1300 L580 1300 L580 1452"/>

    <path d="M200 1508 L200 1600 L290 1600"/>
    <path d="M390 1508 L390 1602"/>
    <path d="M580 1508 L580 1600 L490 1600"/>

    <path d="M390 1658 L390 1722"/>
    <path d="M390 1778 L390 1848"/>
