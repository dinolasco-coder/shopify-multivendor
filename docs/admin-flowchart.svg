  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a73e8">
    <text x="500" y="328">No</text>
    <text x="520" y="262">Retry</text>
    <text x="402" y="430">Yes</text>
    <text x="160" y="598">Sellers</text>
    <text x="402" y="710">Products</text>
    <text x="560" y="598">Orders</text>
    <text x="152" y="990">Yes</text>
    <text x="48" y="1020">No</text>
    <text x="402" y="990">Yes</text>
    <text x="530" y="1020">No</text>
    <text x="210" y="1288">Payouts</text>
    <text x="402" y="1400">Reports</text>
    <text x="520" y="1288">Settings</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <ellipse cx="390" cy="70" rx="70" ry="22" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="390" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Start</text>

    <rect x="290" y="122" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Open Shopify Admin</text>

    <rect x="290" y="222" width="200" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="1.75"/>
    <text x="390" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Open Multivendor App</text>
    <text x="390" y="264" text-anchor="middle" font-size="11" fill="#555">(/app)</text>

